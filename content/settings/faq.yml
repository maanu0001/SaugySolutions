home:
  - question: Wir sind ein kleiner Betrieb. Sind wir dafür zu klein?
    answer: >-
      Nein – kleine Betriebe, Vereine und Selbstständige sind genau unsere Zielgruppe. Der Umfang
      richtet sich nach dem, was Sie tatsächlich brauchen. Eine überschaubare Website, die ihren
      Zweck erfüllt, ist uns lieber als ein aufgeblähtes Projekt.
    order: 1
    visible: true
  - question: Wir wissen noch nicht genau, was wir wollen. Können wir trotzdem anfragen?
    answer: >-
      Ja. Eine grobe Idee genügt. Im Erstgespräch klären wir gemeinsam, was sinnvoll ist – und was
      Sie nicht brauchen. Das Gespräch ist kostenlos und unverbindlich.
    order: 2
    visible: true
  - question: Was kostet ein erstes Gespräch?
    answer: >-
      Nichts. Das Erstgespräch ist kostenlos und unverbindlich. Kosten entstehen erst, wenn Sie eine
      schriftliche Offerte freigeben.
    order: 3
    visible: true
  - question: Müssen wir uns später selbst um die Technik kümmern?
    answer: >-
      Nur wenn Sie möchten. Auf Wunsch übernehmen wir Hosting, Updates, Sicherungen und Anpassungen.
      Verpflichtend ist das nicht.
    order: 4
    visible: true
  - question: Arbeiten Sie nur in der Region?
    answer: >-
      Der Schwerpunkt liegt auf Betrieben in der Schweiz. Ein persönliches Treffen ist gut möglich,
      vieles lässt sich aber auch telefonisch und online klären – je nachdem, was für Sie einfacher
      ist.
    order: 5
    visible: true
services:
  - question: Was kostet eine Website?
    answer: >-
      Das hängt vom Umfang ab – eine Website mit fünf Seiten ist etwas anderes als ein Auftritt mit
      geschütztem Bereich und Sonderfunktionen. Wir nennen deshalb keine Pauschalpreise, die am
      Schluss ohnehin nicht stimmen. Nach dem Erstgespräch erhalten Sie eine schriftliche Offerte,
      in der einmalige Kosten und allfällige laufende Kosten getrennt ausgewiesen sind. Bis dahin
      entstehen Ihnen keine Kosten.
    order: 1
    visible: true
  - question: Wie lange dauert die Umsetzung?
    answer: >-
      Die Dauer richtet sich nach dem Umfang und danach, wie schnell Inhalte wie Texte und Bilder
      verfügbar sind. Erfahrungsgemäss ist die Bereitstellung der Inhalte der Punkt, der ein Projekt
      am ehesten verzögert. Einen realistischen Zeitrahmen vereinbaren wir zusammen mit der Offerte,
      bevor die Arbeit beginnt.
    order: 2
    visible: true
  - question: Muss ich Texte und Bilder selbst liefern?
    answer: >-
      Sie müssen nicht bei null beginnen. Am besten funktioniert es, wenn Sie liefern, was bereits
      vorhanden ist – auch stichwortartig. Wir bringen das in eine Form, die für Besucherinnen und
      Besucher verständlich ist. Wer Texte und Bilder liefert, halten wir vorher gemeinsam fest,
      damit während der Umsetzung nichts liegen bleibt.
    order: 3
    visible: true
  - question: Kann eine bestehende Website übernommen werden?
    answer: >-
      Ja. Wir schauen uns den bestehenden Auftritt an und sagen ehrlich, ob eine Überarbeitung
      sinnvoll ist oder ein Neuaufbau am Ende weniger Aufwand bedeutet. Auch die Übernahme einer
      Website, die technisch niemand mehr betreut, ist möglich – dafür brauchen wir Zugang zu Domain
      und Hosting.
    order: 4
    visible: true
  - question: Was passiert nach der Veröffentlichung?
    answer: >-
      Sie bleiben nicht allein. Für Anpassungen, Fragen oder Probleme ist weiterhin dieselbe
      Ansprechperson zuständig. Auf Wunsch übernehmen wir Hosting, Updates, Sicherungen und laufende
      Anpassungen; ebenso können Sie die Website selbst weiterbetreiben.
    order: 5
    visible: true
  - question: Können Sie Domain und E-Mail einrichten?
    answer: >-
      Ja. Wir registrieren die Domain oder übernehmen eine bestehende und richten E-Mail-Adressen
      mit Ihrer eigenen Domain ein – inklusive Einrichtung auf Ihren Geräten. Bei einem Wechsel des
      Anbieters übernehmen wir bestehende Nachrichten.
    order: 6
    visible: true
  - question: Sind Wartung und Hosting verpflichtend?
    answer: >-
      Nein. Beides ist ein Angebot, keine Bedingung. Viele Kundinnen und Kunden nutzen es, weil sie
      sich nicht um Updates und Sicherungen kümmern möchten. Wenn Sie die Website lieber selbst
      betreiben oder bereits ein Hosting haben, ist das ebenso möglich.
    order: 7
    visible: true
