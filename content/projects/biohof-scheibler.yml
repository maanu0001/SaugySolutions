intro: >-
  Der Biohof Scheibler in Oftringen ist ein Familienbetrieb mit Ackerbau, Gemüsebau und
  Mutterkuhhaltung. Ein Teil der Produkte wird über den eigenen Hofladen direkt vermarktet. Die
  Website stellt den Betrieb vor und informiert über den Hofladen.
situation: >-
  Direktvermarktung lebt davon, dass Kundschaft den Hof findet und weiss, wann der Laden offen ist
  und was es gibt. Genau diese Informationen suchen Interessierte heute zuerst online – häufig
  unterwegs auf dem Mobiltelefon.
goals:
  - Den Hofladen mit Öffnungszeiten und Sortiment verständlich präsentieren
  - Den Betrieb und seine Arbeitsweise vorstellen
  - Auf dem Mobiltelefon schnell die wichtigsten Angaben liefern
  - Eine einfache Möglichkeit zur Kontaktaufnahme bieten
delivered:
  - Aufbau und Struktur der Website
  - Eigene Bereiche für Hofladen und Landwirtschaft
  - Darstellung der Öffnungszeiten und Kontaktangaben
  - Umsetzung für Mobiltelefon, Tablet und Desktop
  - Technische Einrichtung und Betrieb
challenges:
  - title: Breites Sortiment, begrenzter Platz
    text: >-
      Der Hofladen führt ein sehr umfangreiches Sortiment. Auf der Website musste daraus eine
      verständliche Übersicht werden, statt einer vollständigen Produktliste.
  - title: Informationen, die aktuell bleiben müssen
    text: >-
      Öffnungszeiten und Angaben zum Hofladen sind die meistgesuchten Inhalte. Sie mussten so
      platziert werden, dass sie sofort sichtbar und einfach anpassbar sind.
  - title: Zeit neben dem Betrieb
    text: >-
      Ein Landwirtschaftsbetrieb hat keine Zeit für aufwendige Websitepflege. Die Lösung musste ohne
      laufenden Aufwand funktionieren.
