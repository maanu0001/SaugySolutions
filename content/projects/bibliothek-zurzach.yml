intro: >-
  Die Fleckenbibliothek Zurzach in Bad Zurzach ist eine öffentliche Bibliothek mit einem breiten
  Medienangebot – von Belletristik und Sachbüchern über Kinderbücher und Comics bis zu
  Zeitschriften, DVDs und digitalen Medien. Die Website bündelt die Informationen rund um Besuch und
  Ausleihe.
situation: >-
  Die Ausleihe selbst läuft über einen externen Bibliothekskatalog. Was fehlte, war ein eigener
  Auftritt, der Öffnungszeiten, Angebot und Hinweise an einem Ort zusammenfasst und den Weg in den
  Katalog klar aufzeigt.
