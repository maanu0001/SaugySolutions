<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Der Adminbereich gehört nicht in Suchmaschinen. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="same-origin" />

    <title>Inhalte verwalten · Saugy Solutions</title>

    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <meta name="theme-color" content="#080a0a" />

    <style>
      /* Ladeanzeige, bis das CMS bereit ist. */
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #080a0a;
        color: #f4f7f6;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }

      #ladehinweis {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
        gap: 0.6rem;
      }

      #ladehinweis strong {
        font-size: 1.05rem;
      }

      #ladehinweis span {
        font-size: 0.9rem;
        color: #a6b0ad;
        max-width: 34rem;
      }

      #ladehinweis .fehler {
        color: #ff6b67;
      }
    </style>
  </head>

  <body>
    <div id="ladehinweis">
      <strong>Adminbereich wird geladen …</strong>
      <span id="ladetext">Einen Moment bitte.</span>
    </div>

    <!--
      Decap CMS wird von der eigenen Domain geladen (kein externes CDN).
      Die Datei stammt aus node_modules und wird beim Build nach
      /admin/vendor/ kopiert (siehe scripts/prepare-admin.mjs).
    -->
    <script src="/admin/vendor/decap-cms.js"></script>

    <script>
      (function () {
        var hinweis = document.getElementById('ladehinweis');
        var text = document.getElementById('ladetext');

        if (!window.CMS) {
          text.className = 'fehler';
          text.textContent =
            'Der Adminbereich konnte nicht geladen werden. Bitte die Seite neu laden. '
            + 'Besteht das Problem weiterhin, wurde der Build möglicherweise unvollständig hochgeladen.';
          return;
        }

        // Ist das CMS bereit, verschwindet die Ladeanzeige.
        window.CMS.registerEventListener({
          name: 'preSave',
          handler: function () {},
        });

        window.addEventListener('load', function () {
          window.setTimeout(function () {
            if (hinweis && hinweis.parentNode) hinweis.parentNode.removeChild(hinweis);
          }, 400);
        });
      })();
    </script>
  </body>
</html>
