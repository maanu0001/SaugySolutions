challenges:
  - title: Zusammenspiel mit einem externen Katalog
    text: >-
      Die eigentliche Ausleihe findet in einem separaten Bibliothekssystem statt. Der Übergang
      dorthin musste klar erkennbar sein, ohne die Website mit fremder Technik zu überfrachten.
  - title: Sehr breites Publikum
    text: >-
      Die Bibliothek wird von Kindern, Familien, Schulen und älteren Personen genutzt. Schrift,
      Kontraste und Navigation mussten entsprechend einfach und gut lesbar sein.
  - title: Pflege im Alltagsbetrieb
