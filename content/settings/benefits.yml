items:
  - icon: user
    title: Direkter Kontakt statt anonymer Prozesse
    text: >-
      Sie sprechen mit der Person, die Ihr Projekt umsetzt. Keine wechselnden Zuständigkeiten, kein
      Ticketsystem, keine Weiterleitung durch mehrere Abteilungen.
    order: 1
    visible: true
  - icon: chat
    title: Technik verständlich erklärt
    text: >-
      Wir erklären Zusammenhänge in normaler Sprache – so, dass Sie nachvollziehen können, wofür Sie
      bezahlen, und selbst entscheiden können.
    order: 2
    visible: true
  - icon: stack
    title: Website, Hosting und Betreuung aus einer Hand
    text: >-
      Gestaltung, Entwicklung, Hosting, E-Mail und laufende Betreuung kommen von derselben Stelle.
      Sie müssen nicht zwischen mehreren Anbietern vermitteln.
    order: 3
    visible: true
  - icon: target
    title: Lösungen passend zum tatsächlichen Bedarf
    text: >-
      Wir bauen, was Ihr Betrieb wirklich braucht. Wenn eine einfachere Lösung genügt, schlagen wir
      diese vor – auch wenn der Auftrag dadurch kleiner wird.
    order: 4
    visible: true
  - icon: receipt
    title: Transparente Leistungen und nachvollziehbare Kosten
    text: >-
      Vor Projektbeginn steht schriftlich fest, was umgesetzt wird und was es kostet. Einmalige und
      laufende Kosten werden getrennt ausgewiesen.
    order: 5
    visible: true
  - icon: lifebuoy
    title: Unterstützung auch nach der Veröffentlichung
    text: >-
      Mit dem Aufschalten endet die Zusammenarbeit nicht. Für Anpassungen, Fragen oder Probleme
      bleibt dieselbe Ansprechperson zuständig.
    order: 6
    visible: true
